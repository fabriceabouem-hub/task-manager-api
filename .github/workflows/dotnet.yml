name: .NET Tests

on:
   push:
     branches: [ main ]
   pull_request:
     branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run tests
        run: dotnet test TaskManager.Tests/TaskManager.Tests.csproj